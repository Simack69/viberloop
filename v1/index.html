<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="application-name" content="Viberloop Bio">
    <title>Viberloop Bio - Field App</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
        }

        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .mining-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .tab-active {
            background: linear-gradient(135deg, #9333ea, #7e22ce);
            color: white;
        }

        .tab-inactive {
            background: rgba(255, 255, 255, 0.05);
            color: #d8b4fe;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-block bg-purple-600 p-4 rounded-[2rem] mb-4">
                    <i class="fas fa-recycle text-white text-4xl"></i>
                </div>
                <h1 class="text-white text-3xl font-black uppercase tracking-widest mb-2">Viberloop</h1>
                <p class="text-purple-300 text-sm">Bio Cotton Supply Chain</p>
            </div>

            <div class="bg-white/10 backdrop-blur-lg rounded-[2rem] p-8 border border-white/20">
                <h2 class="text-white text-xl font-bold mb-6">Select Your Role</h2>

                <div class="space-y-3">
                    <button onclick="login('WASTE_SOURCE')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-warehouse mr-3"></i>Waste Source</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('RECYCLING_HUB')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-layer-group mr-3"></i>Recycling Hub</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('SPINNER')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-cog mr-3"></i>Spinner</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('WEAVER')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-th mr-3"></i>Weaver</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('MANUFACTURING')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-industry mr-3"></i>Manufacturing</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('POL')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-shipping-fast mr-3"></i>Point of Loading</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('POD')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-truck-loading mr-3"></i>Point of Destination</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <button onclick="login('DISTRIBUTION_CENTER')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-6 rounded-2xl transition flex items-center justify-between">
                        <span><i class="fas fa-store mr-3"></i>Distribution Center</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <div class="mt-6 pt-6 border-t border-white/20 space-y-3">
                    <a href="/" class="text-purple-300 hover:text-purple-100 text-sm flex items-center justify-center">
                        <i class="fas fa-home mr-2"></i>
                        Go to Home Screen
                    </a>
                    <a href="/dashboard" class="text-purple-300 hover:text-purple-100 text-sm flex items-center justify-center">
                        <i class="fas fa-chart-line mr-2"></i>
                        Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="hidden min-h-screen p-4 pb-24">
        <!-- Header -->
        <div class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-white text-2xl font-black uppercase tracking-wider">Viberloop</h1>
                    <p class="text-purple-300 text-sm" id="roleDisplay"></p>
                </div>
                <div class="flex gap-2">
                    <a href="/" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl">
                        <i class="fas fa-home"></i>
                    </a>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab Buttons (for roles with split screens) -->
        <div id="tabButtons" class="hidden mb-6 grid grid-cols-2 gap-3">
            <button onclick="switchFormTab('incoming')" id="tabIncoming" class="tab-active py-3 px-6 rounded-xl font-bold">
                <i class="fas fa-arrow-down mr-2"></i>Incoming Goods
            </button>
            <button onclick="switchFormTab('outgoing')" id="tabOutgoing" class="tab-inactive py-3 px-6 rounded-xl font-bold">
                <i class="fas fa-arrow-up mr-2"></i>Outgoing Goods
            </button>
        </div>

        <!-- Transaction Form -->
        <div class="bg-white/10 backdrop-blur-lg rounded-[2rem] p-6 border border-white/20 mb-6">
            <h2 class="text-white text-xl font-bold mb-6 flex items-center">
                <i class="fas fa-plus-circle mr-3 text-purple-400"></i>
                <span id="formTitle">New Transaction</span>
            </h2>

            <form id="transactionForm" class="space-y-4">
                <!-- Universal Fields Section -->
                <div class="bg-purple-900/30 rounded-xl p-4 mb-4 border border-purple-500/30">
                    <h3 class="text-purple-200 font-bold mb-3 text-sm uppercase">Universal Fields</h3>

                    <!-- Customer -->
                    <div class="mb-3">
                        <label class="block text-purple-300 text-sm font-bold mb-2">
                            Customer <span class="text-red-400">*</span>
                        </label>
                        <select id="customer" required
                                class="w-full bg-white/10 border border-purple-400/30 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">Select customer...</option>
                            <option value="EkoPlaza">EkoPlaza</option>
                            <option value="Norma">Norma</option>
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="mb-3">
                        <label class="block text-purple-300 text-sm font-bold mb-2">
                            Date <span class="text-red-400">*</span>
                        </label>
                        <input type="date" id="transactionDate" required
                               class="w-full bg-white/10 border border-purple-400/30 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Purchase Order -->
                    <div>
                        <label class="block text-purple-300 text-sm font-bold mb-2">
                            Purchase Order <span class="text-red-400">*</span>
                        </label>
                        <input type="text" id="purchaseOrder" required
                               class="w-full bg-white/10 border border-purple-400/30 rounded-xl px-4 py-3 text-white placeholder-purple-300/50 focus:outline-none focus:ring-2 focus:ring-purple-500"
                               placeholder="Enter purchase order...">
                    </div>
                </div>

                <!-- Dynamic Form Fields Container -->
                <div id="dynamicFields">
                    <!-- Fields will be inserted here dynamically -->
                </div>

                <!-- Multi-Photo & File Upload -->
                <div>
                    <label class="block text-purple-300 text-sm font-bold mb-2">
                        Photos & Files (Optional)
                    </label>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <label class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl cursor-pointer text-center transition">
                            <i class="fas fa-camera mr-2"></i>
                            <span>Take Photos</span>
                            <input type="file" id="photoInputCamera" accept="image/*" capture="environment" class="hidden" multiple onchange="handleFileUpload(event, 'photo')">
                        </label>
                        <label class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl cursor-pointer text-center transition">
                            <i class="fas fa-upload mr-2"></i>
                            <span>Upload Photos</span>
                            <input type="file" id="photoInputUpload" accept="image/*" class="hidden" multiple onchange="handleFileUpload(event, 'photo')">
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-xl cursor-pointer text-center transition block">
                            <i class="fas fa-paperclip mr-2"></i>
                            <span>Attach Files (PDF, Docs)</span>
                            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.csv" class="hidden" multiple onchange="handleFileUpload(event, 'file')">
                        </label>
                    </div>
                    <div class="flex justify-between mb-3">
                        <span class="text-purple-300 text-xs">
                            <i class="fas fa-info-circle mr-1"></i>
                            <span id="uploadCount">0 photos, 0 files</span>
                        </span>
                        <button type="button" onclick="clearAllFiles()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded-lg text-xs">
                            <i class="fas fa-times mr-1"></i>Clear All
                        </button>
                    </div>

                    <!-- Photo Gallery -->
                    <div id="photoGallery" class="grid grid-cols-3 gap-2 mb-3 hidden">
                        <!-- Photos will be inserted here -->
                    </div>

                    <!-- File List -->
                    <div id="fileList" class="space-y-2 hidden">
                        <!-- Files will be inserted here -->
                    </div>

                    <canvas id="photoCanvas" class="hidden"></canvas>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-black py-4 px-6 rounded-2xl uppercase tracking-wider transition-all transform hover:scale-105">
                    <i class="fas fa-cubes mr-2"></i>
                    Submit to Chain
                </button>
            </form>
        </div>

        <!-- Recent Transactions -->
        <div class="bg-white/10 backdrop-blur-lg rounded-[2rem] p-6 border border-white/20">
            <h2 class="text-white text-xl font-bold mb-4 flex items-center">
                <i class="fas fa-history mr-3 text-purple-400"></i>
                Recent Transactions
            </h2>
            <div id="recentTransactions" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Mining Modal -->
    <div id="miningModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="miningTitle">
        <div class="glassmorphism rounded-[2rem] p-8 max-w-sm w-full text-center">
            <div class="mb-6">
                <div class="inline-block bg-purple-600 p-6 rounded-full pulse-animation">
                    <i class="fas fa-cubes text-white text-4xl"></i>
                </div>
            </div>
            <h3 class="text-white text-xl font-bold mb-2">Mining Transaction</h3>
            <p class="text-purple-300 text-sm mb-4 mining-dots">Broadcasting to Solana Network</p>
            <div class="bg-purple-600/30 rounded-full h-2 overflow-hidden">
                <div class="bg-purple-500 h-full w-3/4 animate-pulse"></div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="successTitle">
        <div class="glassmorphism rounded-[2rem] p-8 max-w-sm w-full text-center">
            <div class="mb-6">
                <div class="inline-block bg-green-500 p-6 rounded-full">
                    <i class="fas fa-check text-white text-4xl"></i>
                </div>
            </div>
            <h3 class="text-white text-xl font-bold mb-2">Transaction Confirmed!</h3>
            <p class="text-purple-300 text-sm mb-4" id="successHash"></p>
            <button onclick="closeSuccessModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-xl">
                Continue
            </button>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="glassmorphism rounded-[2rem] p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white text-xl font-bold">Confirm Transaction</h3>
                <button onclick="closeConfirmation()" class="text-purple-300 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div id="confirmationContent" class="space-y-3 mb-6">
                <!-- Dynamically populated -->
            </div>

            <div class="flex gap-3">
                <button onclick="closeConfirmation()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-xl transition">
                    <i class="fas fa-times mr-2"></i>Cancel
                </button>
                <button onclick="confirmSubmission()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-xl transition">
                    <i class="fas fa-check mr-2"></i>Submit to Chain
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Auto-Configuration (from Firebase Hosting) -->
    <script src="/__/firebase/init.js?useService=database,storage"></script>
    <script>
        // Get Firebase services (Firebase is auto-initialized by Firebase Hosting)
        let app, database, storage;
        try {
            // Wait for Firebase to be auto-initialized
            app = firebase.app();
            database = firebase.database();
            storage = firebase.storage();
            console.log("✅ Firebase initialized successfully via Firebase Hosting");
        } catch (error) {
            console.error("❌ Firebase initialization error:", error);
            // Fallback: try to load from local config file (for local development)
            console.log("⚠️ Attempting fallback to local config...");
            fetch('../firebase-config.js')
                .then(response => response.text())
                .then(scriptText => {
                    eval(scriptText);
                    app = firebase.initializeApp(firebaseConfig);
                    database = firebase.database();
                    storage = firebase.storage();
                    console.log("✅ Firebase initialized with local config");

                    console.error("❌ Fallback also failed:", err);
                    alert("Firebase configuration error. Please check your setup.");

        // ==================== MULTI-FILE UPLOAD HANDLING ====================
        function handleFileUpload(event, type) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            files.forEach(file => {
                if (type === 'photo') {
                    // Check if max photos reached
                    if (uploadedPhotos.length >= 10) {
                        alert('Maximum 10 photos allowed');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        compressAndAddPhoto(file, e.target.result);
                    };
                    reader.readAsDataURL(file);
                } else if (type === 'file') {
                    // Check if max files reached
                    if (uploadedFiles.length >= 5) {
                        alert('Maximum 5 files allowed');
                        return;
                    }

                    // Check file size (max 5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`File "${file.name}" is too large. Maximum 5MB allowed.`);
                        return;
                    }

                    uploadedFiles.push({
                        file: file,
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        url: null // Will be set after upload to Firebase
                    });

                    renderFileList();
                    updateUploadCount();
                }
            });

            // Clear input
            event.target.value = '';
        }

        function compressAndAddPhoto(file, dataUrl) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('photoCanvas');
                const ctx = canvas.getContext('2d');

                let width = img.width;
                let height = img.height;
                const maxDimension = 800;

                if (width > height && width > maxDimension) {
                    height = (height / width) * maxDimension;
                    width = maxDimension;
                } else if (height > maxDimension) {
                    width = (width / height) * maxDimension;
                    height = maxDimension;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                let quality = 0.7;
                let compressed = canvas.toDataURL('image/jpeg', quality);

                // Compress more if needed (max 500KB)
                while (compressed.length > 500000 && quality > 0.1) {
                    quality -= 0.1;
                    compressed = canvas.toDataURL('image/jpeg', quality);
                }

                // Add to photos array
                uploadedPhotos.push({
                    file: file,
                    preview: compressed,
                    url: null // Will be set after upload to Firebase
                });

                renderPhotoGallery();
                updateUploadCount();
            };
            img.onerror = function() {
                alert('Error processing image. Please try another photo.');
            };
            img.src = dataUrl;
        }

        async function confirmSubmission() {
            if (!pendingFormData) {
                alert('No pending transaction data');
                return;
            }

            // Hide confirmation modal
            document.getElementById('confirmationModal').classList.add('hidden');

            // Show mining modal
            document.getElementById('miningModal').classList.remove('hidden');

            const miningDelay = Math.floor(Math.random() * 700) + 800;

            setTimeout(async () => {
                try {
                    // Debug logging
                    console.log('🔍 Starting transaction submission...');
                    console.log('📊 Database object:', database);
                    console.log('📊 Firebase initialized:', !!firebase);

                    const hash = 'SOL-' + Math.random().toString(36).substring(2, 15) +
                                 Math.random().toString(36).substring(2, 15);

                    // Upload photos and files to Firebase Storage
                    const photoUrls = [];
                    const fileUrls = [];

                    // Upload photos
                    for (let i = 0; i < uploadedPhotos.length; i++) {
                        const photo = uploadedPhotos[i];
                        try {
                            console.log(`📸 Uploading photo ${i + 1}/${uploadedPhotos.length}...`);

                            // Convert base64 to blob
                            const response = await fetch(photo.preview);
                            const blob = await response.blob();

                            // Create storage path
                            const timestamp = Date.now();
                            const filename = `photo-${i + 1}-${timestamp}.jpg`;
                            const storagePath = `transactions/${hash}/photos/${filename}`;

                            // Upload to Firebase Storage
                            const storageRef = storage.ref(storagePath);
                            await storageRef.put(blob);

                            // Get download URL
                            const url = await storageRef.getDownloadURL();
                            photoUrls.push({
                                url: url,
                                filename: filename,
                                uploadedAt: timestamp
                            });

                            console.log(`✅ Photo ${i + 1} uploaded: ${url}`);
                        } catch (error) {
                            console.error(`❌ Error uploading photo ${i + 1}:`, error);
                            // Continue with other photos
                        }
                    }

                    // Upload files
                    for (let i = 0; i < uploadedFiles.length; i++) {
                        const fileData = uploadedFiles[i];
                        try {
                            console.log(`📎 Uploading file ${i + 1}/${uploadedFiles.length}...`);

                            // Create storage path
                            const timestamp = Date.now();
                            const storagePath = `transactions/${hash}/files/${fileData.name}`;

                            // Upload to Firebase Storage
                            const storageRef = storage.ref(storagePath);
                            await storageRef.put(fileData.file);

                            // Get download URL
                            const url = await storageRef.getDownloadURL();
                            fileUrls.push({
                                url: url,
                                name: fileData.name,
                                type: fileData.type,
                                size: fileData.size,
                                uploadedAt: timestamp
                            });

                            console.log(`✅ File ${i + 1} uploaded: ${url}`);
                        } catch (error) {
                            console.error(`❌ Error uploading file ${i + 1}:`, error);
                            // Continue with other files
                        }
                    }

                    // Prepare transaction data
                    const transaction = {
                        ...pendingFormData,
                        hash: hash,
                        time: new Date().toLocaleString(),
                        photos: photoUrls,
                        files: fileUrls,
                        photoCount: photoUrls.length,
                        fileCount: fileUrls.length,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    };

                    console.log('📦 Transaction data:', transaction);
                    console.log('🚀 Attempting to push to Firebase...');

                    await database.ref('transactions').push(transaction);

                    console.log('✅ Transaction saved successfully!');

                    document.getElementById('miningModal').classList.add('hidden');
                    document.getElementById('successHash').textContent = `Hash: ${hash}`;
                    document.getElementById('successModal').classList.remove('hidden');

                    document.getElementById('transactionForm').reset();
                    clearAllFiles();

                    // Reset to today's date
                    const today = new Date().toISOString().split('T')[0];
                    document.getElementById('transactionDate').value = today;

                    loadRecentTransactions();

                    // Clear pending data
                    pendingFormData = null;

                } catch (error) {
                    console.error('Error saving transaction:', error);
                    console.error('Error details:', {
                        message: error.message,
                        code: error.code,
                        stack: error.stack
                    });
                    document.getElementById('miningModal').classList.add('hidden');
                    alert('Error submitting transaction. Please try again.\n\nError: ' + (error.message || error.code || 'Unknown error') + '\n\nCheck browser console for details.');

                    // Clear pending data on error
                    pendingFormData = null;
                }
            }, miningDelay);
        }

        // ==================== RECENT TRANSACTIONS ====================
        function loadRecentTransactions() {
            const container = document.getElementById('recentTransactions');
            container.innerHTML = '<p class="text-purple-300 text-sm">Loading...</p>';

            database.ref('transactions').orderByChild('timestamp').limitToLast(10).once('value')
                .then(snapshot => {
                    container.innerHTML = '';
                    const transactions = [];

                    snapshot.forEach(childSnapshot => {
                        transactions.unshift({
                            key: childSnapshot.key,
                            data: childSnapshot.val()
                        });
                    });

                    if (transactions.length === 0) {
                        container.innerHTML = '<p class="text-purple-300 text-sm text-center py-4">No transactions yet</p>';
                        return;
                    }

                    transactions.forEach(tx => {
                        const card = document.createElement('div');
                        card.className = 'bg-black/30 rounded-xl p-4 border border-purple-500/30';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="text-white font-bold">${tx.data.nxReference || tx.data.packingList || 'N/A'}</div>
                                    <div class="text-purple-300 text-sm">${tx.data.location}</div>
                                    <div class="text-purple-400 text-xs">${tx.data.customer || 'N/A'} - ${tx.data.transactionType || 'Single'}</div>
                                </div>
                                <div class="bg-purple-600 px-3 py-1 rounded-lg text-white text-xs">
                                    ${tx.data.netWeight || 'N/A'} kg
                                </div>
                            </div>
                            <div class="text-purple-400 text-xs">
                                <i class="fas fa-clock mr-1"></i>${tx.data.time}
                            </div>
                            <div class="text-purple-400 text-xs mt-1 truncate">
                                <i class="fas fa-link mr-1"></i>${tx.data.hash}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error loading transactions:', error);
                    container.innerHTML = '<p class="text-red-400 text-sm">Error loading transactions</p>';
                });
        }

        // ==================== AUTO-LOGIN IF ROLE EXISTS ====================
        window.addEventListener('DOMContentLoaded', function() {
            const savedRole = localStorage.getItem('viberloop_role');
            if (savedRole && roleConfig[savedRole]) {
                login(savedRole);
            }
        });
    </script>
</body>
</html>
